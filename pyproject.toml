[project]
name = "lnprep"
version = "1.0.0"
description = "Lecture Notes Preparation CLI - 3-Zone Architecture, XML Note Injection, SBC Audit, and Reference Verification"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "WS Loh", email = "loh.wilson@gmail.com"}
]
keywords = ["teaching", "pptx", "lecture-notes", "pedagogy", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.16.0",
    "click>=8.0.0",
    "rich>=14.1.0",
    "python-pptx>=1.0.2",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
lnprep = "lnprep.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lnprep"]

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "E741",
    "F841",
    "E402",
    "E722",
]
