[project]
name = "lnprep"
# Version lives in src/lnprep/__init__.py only; it was previously restated here,
# in config.py's Crossref User-Agent, and in a test assertion.
dynamic = ["version"]
description = "Lecture Notes Preparation CLI - 3-Zone Architecture, XML Note Injection, SBC Audit, and Reference Verification"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [
    {name = "WS Loh", email = "loh.wilson@gmail.com"}
]
urls = { Repository = "https://github.com/lohwswilson/lnprep" }
keywords = ["teaching", "pptx", "lecture-notes", "pedagogy", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.16.0",
    "click>=8.0.0",
    "rich>=14.1.0",
    "python-pptx>=1.0.2",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
lnprep = "lnprep.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/lnprep/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lnprep"]

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "slow: long-running checks",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 stays off: line-length is a soft guideline here and 70+ existing lines exceed
# it. E741 (ambiguous `l`) stays off pending a rename pass. F841/E402/E722 were
# ignored but have zero violations — F841 in particular guards this codebase's
# characteristic failure, computing a result and dropping it.
ignore = [
    "E501",
    "E741",
]

[tool.ruff.lint.isort]
known-first-party = ["lnprep"]
